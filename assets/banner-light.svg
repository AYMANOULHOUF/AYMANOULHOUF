<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ayman Oulhouf - Software Developer</title>
  <desc id="desc">A light banner with the name Ayman Oulhouf, the role Software Developer, and the stack Go, React, Kotlin and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 40) rotate(135) scale(280 280)">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 280) rotate(-45) scale(300 300)">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#0F172A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <rect x="70" y="70" width="4" height="160" rx="2" fill="url(#accent)"/>

  <text x="94" y="96" fill="#0891B2" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4">SOFTWARE DEVELOPER</text>
  <text x="92" y="158" fill="#0F172A" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Ayman Oulhouf</text>
  <text x="94" y="196" fill="#475569" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="400">Full-stack engineering · Go · React · Kotlin · PostgreSQL</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">
    <rect x="94" y="224" width="112" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="150" y="243" text-anchor="middle">SELF-HOSTED</text>
    <rect x="216" y="224" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="262" y="243" text-anchor="middle">REAL-TIME</text>
    <rect x="318" y="224" width="82" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="359" y="243" text-anchor="middle">MOBILE</text>
    <rect x="410" y="224" width="96" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="458" y="243" text-anchor="middle">GEOSPATIAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="66" width="370" height="168" rx="16" fill="#0B1120" stroke="#1E293B"/>
    <path d="M760 82C760 73.1634 767.163 66 776 66H1114C1122.84 66 1130 73.1634 1130 82V98H760V82Z" fill="#111827"/>
    <circle cx="784" cy="82" r="4" fill="#F87171"/>
    <circle cx="800" cy="82" r="4" fill="#FBBF24"/>
    <circle cx="816" cy="82" r="4" fill="#34D399"/>
    <text x="784" y="130" fill="#22D3EE" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14">$ whoami</text>
    <text x="784" y="154" fill="#E2E8F0" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14">ayman</text>
    <text x="784" y="184" fill="#22D3EE" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14">$ stack --list</text>
    <text x="784" y="208" fill="#A78BFA" font-family="'Cascadia Code', 'Consolas', monospace" font-size="14">go · react · kotlin · postgres</text>
  </g>
</svg>
